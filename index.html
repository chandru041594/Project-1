<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10101c">
  <title>Hello, World! — A little bit of magic</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #10101c; color: #f7f4ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; background: radial-gradient(ellipse at 16% 18%, #6d4bff35, transparent 36%), radial-gradient(ellipse at 84% 78%, #13d9c629, transparent 34%), #10101c; }
    .glow { position: fixed; width: 28rem; aspect-ratio: 1; border-radius: 50%; filter: blur(100px); opacity: .18; pointer-events: none; animation: drift 12s ease-in-out infinite alternate; }
    .one { background: #8b5cf6; top: -15rem; left: -10rem; }
    .two { background: #18d7c2; bottom: -18rem; right: -10rem; animation-delay: -5s; }
    main { position: relative; width: min(680px, calc(100% - 2.5rem)); padding: clamp(2.5rem, 8vw, 5.5rem) clamp(1.5rem, 7vw, 4.5rem); text-align: center; border: 1px solid #ffffff1b; border-radius: 32px; background: linear-gradient(145deg, #ffffff0d, #ffffff04); box-shadow: 0 30px 100px #0007, inset 0 1px #ffffff12; backdrop-filter: blur(20px); animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    .sparkle { display: inline-grid; width: 64px; height: 64px; place-items: center; margin-bottom: 1.7rem; border: 1px solid #ffffff20; border-radius: 20px; background: linear-gradient(135deg, #a78bfa33, #2dd4bf22); font-size: 1.8rem; box-shadow: 0 0 38px #a78bfa26; animation: float 4s ease-in-out infinite; }
    .eyebrow { margin: 0 0 .85rem; color: #a9a3be; font-size: .75rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3.2rem, 11vw, 6.2rem); line-height: .98; letter-spacing: -.075em; font-weight: 800; }
    h1 span { display: block; padding: .08em 0 .16em; background: linear-gradient(100deg, #c4b5fd 8%, #f0abfc 48%, #5eead4 92%); background-clip: text; -webkit-background-clip: text; color: transparent; }
    .intro { max-width: 390px; margin: 1.4rem auto 0; color: #b9b5c8; font-size: clamp(1rem, 2.4vw, 1.12rem); line-height: 1.75; }
    .badge { display: inline-flex; align-items: center; gap: .55rem; margin-top: 2.1rem; padding: .7rem 1rem; border: 1px solid #ffffff17; border-radius: 999px; background: #ffffff08; color: #d8d4e3; font-size: .82rem; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #5eead4; box-shadow: 0 0 12px #5eead4; }
    footer { margin-top: 2.4rem; color: #777388; font-size: .75rem; letter-spacing: .04em; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes float { 50% { transform: translateY(-7px) rotate(4deg); } }
    @keyframes drift { to { transform: translate(40px, 30px) scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="glow one" aria-hidden="true"></div>
  <div class="glow two" aria-hidden="true"></div>
  <main>
    <div class="sparkle" aria-hidden="true">✦</div>
    <p class="eyebrow">A tiny beginning</p>
    <h1>Hello,<span>World!</span></h1>
    <p class="intro">Every great idea starts somewhere. Here’s to the first line, the next big thing, and everything in between.</p>
    <div class="badge"><span class="dot" aria-hidden="true"></span> Your page is ready to shine</div>
    <footer>Made with a little extra magic ✨</footer>
  </main>
</body>
</html>
